        .poster-container {
            display: flex;
            flex-wrap: wrap; 
            width: 1100px;
            justify-content: center; 
        }

        .poster {
            flex: 1 1 30%; /* Each poster takes up roughly a third of the row */
            max-width: 350px; /* Prevents stretching */
            padding: 5px;
        }


        .poster img {
            width: 100%; 
            height: 100%;
            object-fit: fill;
        }
        
        .row.resources {
            margin-top: 60px;
            width: 100%;
        }

        #resource-slider {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 42em;
        margin: auto;
        border-radius: 3px;
        background: #ffffff;
    }

#resource-slider .arrow {
    cursor: pointer;
    position: absolute;
    width: 2em;
    height: 100%;
    padding: 0;
    margin: 0;
    outline: 0;
    background: transparent;
}

#resource-slider .arrow:hover {
    background: rgba(0, 0, 0, 0.1);
}

#resource-slider .arrow:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 0.75em;
    height: 0.75em;
    margin: auto;
    border-style: solid;
}

#resource-slider .prev {
    left: 0;
    bottom: 0;
}

.arrow next {
    border: none;
}

#resource-slider .prev:before {
    left: 0.25em;
    border-width: 3px 0 0 3px;
    transform: rotate(-45deg);
}

#resource-slider .next {
    right: 0;
    bottom: 0;
}

#resource-slider .next:before {
    right: 0.25em;
    border-width: 3px 3px 0 0;
    transform: rotate(45deg);
}

#resource-slider .resource-slider-frame {
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
}

#resource-slider .resource-slider-item {
    flex: 0 0 25%;
    scroll-snap-align: start;
}

#resource-slider .resource-slider-inset {
    margin: 0.5em 0.25em;
}

@media (max-width: 60em) {
    #resource-slider .resource-slider-item {
      flex: 0 0 33.33%;
    }
    #resource-slider {
      height: 16em;
    }
}
  
@media (max-width: 45em) {
    #resource-slider .resource-slider-item {
      flex: 0 0 50%;
    }
}
  
@media (max-width: 30em) {
    #resource-slider .resource-slider-item {
      flex: 0 0 100%;
    }
    #resource-slider {
      height: 19em;
    }
}


    </style>
