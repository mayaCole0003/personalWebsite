<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya's artworks</title>
    <link rel="icon" href="/imgs/smallerMayalOGO.png">
    <link rel="stylesheet" href="../styling/allProjects.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="header-content">
        <div class="icon-circle" id="wand2">
            <a href="/index.html" class="icon-circle" id="wand">
                <i class="fa-solid fa-arrow-left-long" id="dartpop"></i>
            </a>
        </div>
        <div class="spacer"></div>
    </div>
    
    <section id="projects">
        <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="carousel-caption">
                        <h1>Late Night Breakfast promotional poster</h1>
                        <p>2024</p>
                        <p>Adobe Photoshop</p>
                        <p>Made with Google Labs GenType </p>
                    </div>
                    <img src="/imgs/late_nite_breakfast.png" class="Artimg" alt="Project Image2">
                </div>
                <div class="carousel-item">
                    <div class="carousel-caption">
                        <h1>Recharge promotional poster</h1>
                        <p>2024</p>
                        <p>Adobe Photoshop</p>
                    </div>
                    <img src="/imgs/cad_recharge.png" class="Artimg" alt="Project Image2">
                </div>
                <div class="carousel-item">
                    <div class="carousel-caption">
                        <h1>Bob Ross paint night promotional poster</h1>
                        <p>2024</p>
                        <p>Adobe Photoshop</p>
                    </div>
                    <img src="/imgs/BobRoss_paintnight.png" class="Artimg" alt="Project Image2">
                </div>
                <div class="carousel-item">
                    <div class="carousel-caption">
                        <h1>Paint and Pour Night promotional poster</h1>
                        <p>2024</p>
                        <p>Adobe Photoshop</p>
                    </div>
                    <img src="/imgs/CAD_paint&pour_poster.png" class="Artimg" alt="Project Image2">
                </div>
            <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
                <i class="fas fa-angle-left carousel-control-prev-icon"></i>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
                <i class="fas fa-angle-right carousel-control-next-icon"></i>
                <span class="sr-only">Next</span>
            </a>
        </div>
    </section>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
